<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>Weather Dashboard</h1>
        
        <form id="search-form" class="search-form">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Enter city name (e.g., London, Tokyo)..." 
                required
            >
            <button type="submit">Search</button>
        </form>

        <div id="loading-spinner" class="spinner hidden">Loading...</div>
        <div id="error-message" class="error-message hidden"></div>

        <div id="weather-card" class="weather-card hidden">
            <h2 id="location-name">City, Country</h2>
            <div class="weather-info">
                <div class="metric">
                    <span class="label">Temperature</span>
                    <span id="temp-val" class="value">--</span>
                </div>
                <div class="metric">
                    <span class="label">Humidity</span>
                    <span id="humidity-val" class="value">--</span>
                </div>
                <div class="metric">
                    <span class="label">Wind Speed</span>
                    <span id="wind-val" class="value">--</span>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
